# Runs the content rules and the Autopilot tests on pull requests that touch
# articles, social posts or Autopilot. (The content
# engine checks its own articles before opening a pull request; GitHub doesn't
# start workflows for pull requests opened with a workflow's token, but your
# own pushes to that branch do trigger this.)
name: Content check

on:
  pull_request:
    paths:
      - "content/**"
      - "scripts/content/**"
      - "app/lib/blog-data.tsx"
      - "marketing/facebook/**"
      - "ops/**"
      - "scripts/ops/**"
      - "scripts/facebook/**"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/content/check.mjs
      - run: node --test app/lib/articles.test.mjs app/lib/facebook-posts.test.mjs app/lib/autopilot.test.mjs
