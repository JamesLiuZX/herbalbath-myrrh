# Autopilot: the AI marketing team (ops/README.md). Each agent runs on its own
# schedule, or on demand from the Actions tab or Telegram (/run <agent>).
# Logs show counts only: this repository, and so its logs, are public.
name: Autopilot agents

on:
  schedule:
    - cron: "3 23 * * 0" # research: Mondays 07:03 SGT
    - cron: "7 0 * * 1" # cmo: Mondays 08:07 SGT
    - cron: "13 2 * * 1,3,5" # social: Mon, Wed, Fri 10:13 SGT
    - cron: "19 3 * * 2,5" # creative: Tue, Fri 11:19 SGT
    - cron: "23 1 * * 3" # b2b: Wednesdays 09:23 SGT
    - cron: "29 1 1 * *" # finance: 1st of the month 09:29 SGT
  workflow_dispatch:
    inputs:
      agent:
        description: Which agent
        type: choice
        options: [cmo, research, social, creative, b2b, finance]
      task:
        description: Optional extra instruction for this run
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: autopilot-${{ inputs.agent || github.event.schedule }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pick the agent
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.agent }}
        run: |
          case "$SCHEDULE" in
            "3 23 * * 0") agent=research ;;
            "7 0 * * 1") agent=cmo ;;
            "13 2 * * 1,3,5") agent=social ;;
            "19 3 * * 2,5") agent=creative ;;
            "23 1 * * 3") agent=b2b ;;
            "29 1 1 * *") agent=finance ;;
            *) agent="$CHOSEN" ;;
          esac
          echo "agent=$agent" >> "$GITHUB_OUTPUT"

      - name: Run the agent
        if: steps.pick.outputs.agent != ''
        env:
          AGENT: ${{ steps.pick.outputs.agent }}
          TASK: ${{ inputs.task }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPS_DATA_KEY: ${{ secrets.OPS_DATA_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          AUTOPILOT_PAUSED: ${{ vars.AUTOPILOT_PAUSED }}
          AUTOPILOT_MODEL: ${{ vars.AUTOPILOT_MODEL }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$OPS_DATA_KEY" ]; then
            echo "Autopilot isn't set up yet: add the ANTHROPIC_API_KEY and OPS_DATA_KEY secrets (ops/README.md)."
            exit 0
          fi
          if [ -n "$TASK" ]; then
            node scripts/ops/run-agent.mjs "$AGENT" --commit --task "$TASK"
          else
            node scripts/ops/run-agent.mjs "$AGENT" --commit
          fi
